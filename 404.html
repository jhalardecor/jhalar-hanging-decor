<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Page Not Found | JHALAR · Hanging Decor for Celebrations</title>
    <meta name="description" content="The page you were looking for does not exist.">
    <meta name="theme-color" content="#65142b">
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(1rem,6vw,2rem)}
        .notfound{max-width:560px;text-align:center}
        .notfound .nf-eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--heritage);margin-bottom:18px}
        .notfound h1{font-size:clamp(4rem,16vw,8rem);font-weight:500;letter-spacing:-.018em;line-height:1;color:var(--navy);margin-bottom:20px}
        .notfound p{color:var(--ink-soft);font-size:1rem;line-height:1.7;margin-bottom:34px}
        .notfound a{display:inline-flex;align-items:center;gap:12px;padding:16px 22px;background:var(--navy);color:var(--on-dark);font-size:.86rem;font-weight:600;border-radius:2px;transition:transform .25s var(--ease),background .25s}
        .notfound a:hover{transform:translateY(-2px);background:var(--heritage)}
    </style>
</head>
<body>
    <div class="notfound">
        <p class="nf-eyebrow">404 · Page Not Found</p>
        <h1>Gone with the wind.</h1>
        <p>The page you were looking for does not exist. The collection, however, is very much here.</p>
        <a href="index.html#collection">Back to the collection</a>
    </div>
</body>
</html>
