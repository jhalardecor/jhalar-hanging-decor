<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Page Not Found | JHALAR · Hanging Decor for Celebrations</title>
    <meta name="description" content="The page you were looking for does not exist.">
    <meta name="theme-color" content="#FFFAF1">
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Page-level composition only. Every font, size and colour below is a
           design-system token from style.css - no local values. */
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(1.5rem,6vw,3rem)}
        .notfound{max-width:34rem;text-align:center}
        .notfound .nf-eyebrow{
            font-size:var(--text-eyebrow);font-weight:var(--weight-medium);
            line-height:var(--leading-label);letter-spacing:var(--tracking-eyebrow);
            text-transform:uppercase;color:var(--color-label);
        }
        .notfound h1{
            margin-top:var(--s3);
            font-size:var(--text-display);line-height:var(--leading-display);
        }
        .notfound p{
            margin-top:var(--s4);
            font-size:var(--text-body-lg);line-height:var(--leading-lede);color:var(--color-ink);
            text-wrap:pretty;
        }
        .notfound a{
            display:inline-flex;align-items:center;gap:12px;margin-top:var(--s5);
            padding:15px 22px;min-height:48px;
            background:var(--color-primary);color:var(--color-on-primary);
            font-size:var(--text-body);font-weight:var(--weight-medium);line-height:var(--leading-ui);
            transition:background .25s var(--ease);
        }
        .notfound a:hover{background:var(--color-primary-strong)}
    </style>
</head>
<body>
    <div class="notfound">
        <p class="nf-eyebrow">404 · Page Not Found</p>
