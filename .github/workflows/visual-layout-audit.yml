name: Visual layout audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --directory . > /tmp/site.log 2>&1 &
      - run: |
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html && exit 0; sleep 1; done
          exit 1
      - name: Run visual audit
        id: audit
        run: npm run visual:audit
        continue-on-error: true
      - name: Publish machine-readable report
        if: always()
        run: |
          echo "## Visual Layout Audit" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/layout-report.json ]; then
            node -e "const r=require('./test-results/layout-report.json'); console.log('Viewports:',r.viewports.length,'Failures:',r.failures.length); console.log(JSON.stringify(r.failures,null,2))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-layout-report
          path: |
            test-results/
            playwright-report/
            /tmp/site.log
          if-no-files-found: ignore
      - name: Fail when layout audit finds defects
        if: steps.audit.outcome == 'failure'
        run: exit 1
