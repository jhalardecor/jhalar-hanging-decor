name: Visual layout audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  visual-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --directory . > /tmp/site.log 2>&1 &
      - run: |
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html && exit 0; sleep 1; done
          exit 1
      - run: npm run visual:audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-layout-report
          path: |
            test-results/
            playwright-report/
            /tmp/site.log
          if-no-files-found: ignore
