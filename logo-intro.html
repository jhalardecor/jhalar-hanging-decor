<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JHALAR · Brand Intro</title>
<meta name="description" content="JHALAR hanging decor — brand introduction film.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFAF1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/Mogranx-Medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* =========================================================
   JHALAR — LOGO INTRO MOTION GRAPHIC
   Concept: a jhalar being hung. A thread drops, the letters
   hang into place and settle like ornaments, a garland of
   beads strings itself beneath the wordmark, colour arrives.
   Brand tokens only. Base styles ARE the final frame, so the
   page is correct without JS and under reduced motion; the
   .play class adds the choreography.
   ========================================================= */
:root{
  --ivory:#FFFAF1;--red:#C82039;--red-deep:#A71931;--heritage:#622331;--ink:#141942;
  --ease:cubic-bezier(.22,.61,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --t-thread:.05s;   /* thread drops            */
  --t-letters:.45s;  /* letters hang in         */
  --t-sub:1.7s;      /* hanging decor line      */
  --t-garland:1.9s;  /* garland strings itself  */
  --t-tagline:2.25s; /* colour sets the mood    */
  --t-subline:2.85s; /* supporting line         */
  --t-shine:3.15s;   /* light sweep             */
  --t-actions:3.6s;  /* replay affordance       */
}
@font-face{
  font-family:Mogranx;src:url(assets/fonts/Mogranx-Medium.woff2) format('woff2');
  font-weight:500;font-style:normal;font-display:swap;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ivory);color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* Barely-there stage light + vignette to focus the centre. */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(58% 42% at 50% 40%,rgba(200,32,57,.05) 0%,rgba(200,32,57,0) 70%),
    radial-gradient(130% 100% at 50% 50%,rgba(98,35,49,0) 62%,rgba(98,35,49,.05) 100%);
}
.intro{
  position:relative;min-height:100%;
  display:grid;place-items:center;
  padding:clamp(24px,6vh,64px) 24px calc(clamp(24px,6vh,64px) + env(safe-area-inset-bottom));
}
.stage{
  position:relative;z-index:1;width:min(680px,88vw);
  display:flex;flex-direction:column;align-items:center;
  cursor:default;
}
/* ---- wordmark ---- */
.mark-wrap{position:relative;overflow:hidden;width:100%}
.mark{
  display:block;width:100%;height:auto;
  transform-origin:50% 16.7%; /* the point the thread hangs from */
}
.mark .st1{fill:var(--red)}
.mark .sub{fill:var(--ink);font-family:Mogranx,Arial,sans-serif;font-weight:500;font-size:8.8px;letter-spacing:.08em}
.mark .g-line{stroke:rgba(20,25,66,.38);stroke-width:.8;fill:none}
.ltr,.chev,.drop{transform-box:fill-box;transform-origin:50% 0}
/* ---- shine sweep (screen blend: only the red letters catch it) ---- */
.shine{
  position:absolute;top:-10%;bottom:-10%;left:0;width:34%;
  background:linear-gradient(105deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 100%);
  mix-blend-mode:screen;transform:translateX(-160%) skewX(-8deg);
  pointer-events:none;
}
/* ---- copy ---- */
.tagline{
  margin:clamp(22px,4.5vh,38px) 0 0;text-align:center;
  font-size:clamp(.72rem,2.6vw,.95rem);font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:var(--red);
}
.tagline span{display:inline-block;white-space:pre}
.tagline .ws{width:.55em}
.subline{
  margin:14px 0 0;text-align:center;max-width:44ch;
  font-size:clamp(.9rem,2.3vw,1.05rem);line-height:1.6;
  color:rgba(20,25,66,.78);
}
/* ---- actions + skip ---- */
.actions{
  margin-top:clamp(26px,5vh,44px);display:flex;gap:14px;flex-wrap:wrap;justify-content:center;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:46px;padding:0 22px;border-radius:2px;
  font-family:inherit;font-size:.9rem;font-weight:600;letter-spacing:.01em;
  text-decoration:none;cursor:pointer;
}
.btn-replay{background:transparent;color:var(--heritage);border:1px solid rgba(98,35,49,.4)}
.btn-replay:hover{background:var(--heritage);color:var(--ivory);border-color:var(--heritage)}
.btn-home{background:var(--red);color:var(--ivory);border:1px solid var(--red)}
.btn-home:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.skip{
  position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:5;
  padding:10px 14px;border:0;border-radius:999px;background:transparent;
  color:rgba(20,25,66,.62);font-family:inherit;font-size:.72rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
}
.skip:hover{color:var(--ink)}
.skip:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

/* =========================================================
   CHOREOGRAPHY — only under .play; base state is the end frame
   ========================================================= */
.intro.play .thread-line{
  transform:scaleY(0);
  animation:threadDrop .55s var(--ease) var(--t-thread) both;
}
@keyframes threadDrop{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.intro.play .knot{opacity:0;animation:popIn .3s var(--spring) calc(var(--t-thread) + .48s) both}
@keyframes popIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}

/* Letters hang in: fall, land, pendulum settle — decay encoded in keyframes. */
.intro.play .ltr{
  animation:letterHang 1.05s var(--ease) calc(var(--t-letters) + var(--i)*.07s) both;
}
@keyframes letterHang{
  0%{transform:translateY(-190%) rotate(0deg);opacity:0}
  10%{opacity:1}
  26%{transform:translateY(0) rotate(0deg)}
  38%{transform:translateY(0) rotate(5.5deg)}
  52%{transform:translateY(0) rotate(-3.6deg)}
  66%{transform:translateY(0) rotate(2.2deg)}
  80%{transform:translateY(0) rotate(-1deg)}
  90%{transform:translateY(0) rotate(.4deg)}
  100%{transform:translateY(0) rotate(0deg)}
}

/* "hanging decor" tracks in; chevrons bracket it from both sides. */
.intro.play .sub{
  opacity:0;
  animation:subIn .6s var(--ease) var(--t-sub) both;
}
@keyframes subIn{from{opacity:0;letter-spacing:.4em}to{opacity:1;letter-spacing:.08em}}
.intro.play .chev-l{animation:chevL .55s var(--ease) calc(var(--t-sub) + .08s) both}
.intro.play .chev-r{animation:chevR .55s var(--ease) calc(var(--t-sub) + .08s) both}
@keyframes chevL{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:translateX(0)}}
@keyframes chevR{from{opacity:0;transform:translateX(9px)}to{opacity:1;transform:translateX(0)}}

/* The jhalar: each drop unrolls downward, then swings to rest. */
.intro.play .drop{
  animation:dropIn .8s var(--ease) calc(var(--t-garland) + var(--i)*.06s) both;
}
@keyframes dropIn{
  0%{transform:scaleY(0) rotate(0deg);opacity:0}
  22%{opacity:1}
  45%{transform:scaleY(1) rotate(0deg)}
  58%{transform:scaleY(1) rotate(6deg)}
  72%{transform:scaleY(1) rotate(-3.8deg)}
  84%{transform:scaleY(1) rotate(1.8deg)}
  100%{transform:scaleY(1) rotate(0deg)}
}
/* After landing, the garland breathes — out of phase, barely. */
.intro.play .idle{
  animation:sway 3.4s ease-in-out calc(3.5s + var(--i)*-.37s) infinite alternate;
}
@keyframes sway{from{transform:rotate(0deg)}to{transform:rotate(1.7deg)}}

/* Tagline: letter by letter. */
.intro.play .tagline span:not(.ws){
  animation:tgIn .5s var(--ease) calc(var(--t-tagline) + var(--i)*.026s) both;
}
@keyframes tgIn{from{opacity:0;transform:translateY(.6em)}to{opacity:1;transform:translateY(0)}}

.intro.play .subline{animation:fadeUp .6s var(--ease) var(--t-subline) both}
.intro.play .actions{animation:fadeUp .6s var(--ease) var(--t-actions) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* One pass of light across the finished mark. */
.intro.play .shine{animation:shine 1s ease-in-out var(--t-shine) both}
@keyframes shine{
  0%{transform:translateX(-160%) skewX(-8deg);opacity:0}
  18%{opacity:1}
  82%{opacity:1}
  100%{transform:translateX(320%) skewX(-8deg);opacity:0}
}

/* The whole lockup settles on its thread once everything has landed. */
.intro.play .mark{animation:lockSway 2.2s var(--ease) 3s both}
@keyframes lockSway{
  0%{transform:rotate(0deg)}
  22%{transform:rotate(.85deg)}
  50%{transform:rotate(-.5deg)}
  74%{transform:rotate(.22deg)}
  100%{transform:rotate(0deg)}
}

.intro.play .skip{animation:fadeUp .4s var(--ease) .35s both}

/* Motion is a bonus, never a requirement. */
@media (prefers-reduced-motion:reduce){
  .intro.play .thread-line,.intro.play .knot,.intro.play .ltr,.intro.play .sub,
  .intro.play .chev-l,.intro.play .chev-r,.intro.play .drop,.intro.play .idle,
  .intro.play .tagline span,.intro.play .subline,.intro.play .actions,
  .intro.play .shine,.intro.play .mark,.intro.play .skip{
    animation:none!important;
  }
  .intro.play .shine{display:none}
}
</style>
</head>
<body>

<script>
(function(){
  var intro=document.getElementById('intro');
  var skip=document.getElementById('skip');
  var replay=document.getElementById('replay');
  var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TOTAL=4400;
  var timer=0;

  function end(){skip.hidden=true}
  function schedule(){clearTimeout(timer);skip.hidden=false;timer=setTimeout(end,TOTAL)}
  function play(){
    intro.classList.remove('play');
    void intro.offsetWidth; /* reflow: restart every animation from 0% */
    intro.classList.add('play');
    schedule();
  }
  function skipNow(){
    clearTimeout(timer);
    intro.classList.remove('play'); /* base styles are the finished frame */
    end();
  }

  if(!reduced){play()}
  else{end()}

  replay.addEventListener('click',play);
  skip.addEventListener('click',skipNow);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'||e.key==='Enter'||e.key===' '){skipNow()}
  });
  /* Any tap on the stage finishes the film; buttons and links keep their own actions. */
  intro.addEventListener('click',function(e){
    if(e.target.closest('button,a'))return;
    skipNow();
  });
})();
</script>
